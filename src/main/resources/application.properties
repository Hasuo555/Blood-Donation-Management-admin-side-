# ============================================================
# AMyanHlu Admin — Application Configuration
# ============================================================

# --- Server ---
server.port=8080
server.servlet.context-path=/

# --- DataSource (MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/amyanhlu_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- HikariCP connection pool ---
spring.datasource.hikari.pool-name=AMyanHluHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# --- JSP View Resolver ---
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# --- File Upload (multipart) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Legacy/local asset path. New uploads are stored in Cloudflare R2, but this
# keeps existing /uploads/... database values resolvable during migration.
app.upload-dir=uploads

# --- Cloudflare R2 Storage (S3-compatible) ---
#cloudflare.r2.account-id=6069e37fd9a3b4ba3d7bf4efdbc899fd
cloudflare.r2.endpoint=https://5ee00902aa2227274eee5cd913204f70.r2.cloudflarestorage.com
cloudflare.r2.access-key=a66b5eef18aba629a277e78095bd7b34
cloudflare.r2.secret-key=756765417f711af32f6e73f1b99e282803a0a99749e647f2811ad711c92e4b6b
cloudflare.r2.bucket-name=amyanhlu-storage
cloudflare.r2.token=${CLOUDFLARE_R2_TOKEN}
cloudflare.r2.api-name=amyanhlu-backend-dev-admin

# Public URL prefix for accessing uploaded files (R2 public domain)
cloudflare.r2.public-url-prefix=https://amyanhlu-storage.r2.dev

# --- Logging ---
logging.level.com.amyanhlu=DEBUG
logging.level.org.springframework.security=INFO
